{% extends "base.html" %}
{% block title %}削除の確認 - PDA{% endblock %}
{% block content %}
<h1>削除の確認</h1>
<p>次のタスクを削除します。削除すると元に戻せません。</p>
<p><strong>{{ task.title }}</strong></p>
<form method="post" action="/tasks/{{ task.id }}/delete">
  <button type="submit">削除する</button>
  <a href="{{ '/tasks/done' if task.done else '/tasks' }}">やめる</a>
</form>
{% endblock %}
