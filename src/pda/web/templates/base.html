<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PDA{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 0 auto; padding: 1rem; line-height: 1.6; }
    nav a { margin-right: 1rem; }
    ul.items { list-style: none; padding: 0; }
    ul.items li { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; padding: .5rem 0; border-bottom: 1px solid #ddd; }
    ul.items .title { flex: 1 1 12rem; }
    .meta { color: #666; font-size: .9em; }
    .detail { flex-basis: 100%; color: #444; font-size: .9em; white-space: pre-wrap; }  /* 改行をそのまま見せる */
    textarea { width: 100%; box-sizing: border-box; font-size: 1rem; }
    .overdue { color: #b00020; font-weight: bold; }
    .error { color: #b00020; }
    form.inline { display: inline; }
    input, select, button { font-size: 1rem; }
    /* 編集ポップアップ */
    dialog { width: min(32rem, calc(100vw - 2rem)); border: 1px solid #ccc; border-radius: 8px; padding: 1rem 1.25rem; }
    dialog::backdrop { background: rgba(0, 0, 0, .35); }
    dialog h2 { margin-top: 0; font-size: 1.1rem; }
    dialog input:not([type=date]) { width: 100%; box-sizing: border-box; }
    /* キーワード: 語を横に詰めて並べる。PC ではグループを 2 列、狭い画面では 1 列 */
    .keyword-form { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .25rem; }
    .keyword-form input { flex: 1 1 12rem; }
    .keyword-form .error { flex-basis: 100%; margin: 0; }
    .keyword-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem 1.5rem; }
    .keyword-group h2 { font-size: 1.1rem; margin: .5rem 0; }
    ul.chips { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: .4rem; }
    .chip { display: inline-flex; align-items: center; border: 1px solid #ccc; border-radius: 999px; padding-left: .7rem; background: #f6f6f6; }
    .chip[hidden] { display: none; }
    .chip-delete { border: none; background: none; cursor: pointer; color: #777; min-width: 1.9rem; min-height: 1.9rem; border-radius: 999px; }
    .chip-delete:hover { color: #b00020; background: #eee; }
  </style>
</head>
<body>
  <nav><a href="/tasks">ToDo</a><a href="/keywords">キーワード</a></nav>
  {% block content %}{% endblock %}
  <script>
    // data-confirm を持つフォームは、送信の前にブラウザ標準の確認を出す(キャンセルなら送らない)。
    // 文言は属性から文字列として読むだけ。onsubmit に直接埋め込むとタイトルがコードとして実行されうる
    document.addEventListener("submit", (e) => {
      const message = e.target.dataset.confirm;
      if (message && !confirm(message)) e.preventDefault();
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
