{% extends "base.html" %}
{% block title %}タスクの編集 - PDA{% endblock %}
{% block content %}
<h1>タスクの編集</h1>
<form method="post" action="/tasks/{{ task_id }}/edit" class="panel">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% with prefix="" %}{% include "_task_form_fields.html" %}{% endwith %}
  <p><button type="submit" class="primary">保存</button> <a href="{{ back }}" class="pill-link">やめる</a></p>
</form>
{% endblock %}
