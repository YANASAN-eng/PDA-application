<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>メモ - PDA</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A3224F;text-decoration:none}a:hover{color:#7A1A3B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFAEC; font-family: 'Zen Maru Gothic', sans-serif; color: #4A3540; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="position: absolute; top: -70px; left: 180px; width: 220px; height: 220px; border-radius: 50%; background: #FFF0B8" aria-hidden="true"></div>

  <header style="position: relative; padding: 30px 22px 10px; display: flex; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <p style="margin: 0; font-size: 13px; font-weight: 700; color: #7A6320">{{count}} まい</p>
      <h1 style="margin: 0; font-size: 26px; font-weight: 900">めも</h1>
    </div>
    <button type="button" aria-label="新しいメモ" style="width: 48px; height: 48px; border: none; border-radius: 18px; background: {{accent}}; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 3px 0 #E8D79A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg></button>
  </header>

  <div style="position: relative; margin: 4px 18px 10px; background: #FFFFFF; border-radius: 999px; box-shadow: 0 3px 0 #F0E3B5; padding: 0 16px; display: flex; align-items: center; gap: 8px; height: 48px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A6320" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <label for="memo-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">メモを検索</label>
    <input id="memo-search" type="search" placeholder="タイトル・本文でさがす" style="flex: 1; min-width: 0; border: none; outline: none; font-family: inherit; font-size: 15px; background: transparent; color: #4A3540; height: 44px">
  </div>

  <div style="position: relative; padding: 0 18px 10px; display: flex; gap: 8px; flex-wrap: wrap">
    <sc-for list="{{tags}}" as="g" hint-placeholder-count="5">
      <button type="button" onClick="{{g.pick}}" aria-pressed="{{g.pressed}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 2px solid {{g.border}}; background: {{g.bg}}; color: {{g.fg}}; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{g.label}}</button>
    </sc-for>
  </div>

  <main style="position: relative; flex: 1; overflow: auto; padding: 4px 18px 18px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{memos}}" as="m" hint-placeholder-count="4">
        <a href="Memo.dc.html" style="background: {{m.bg}}; border-radius: 6px 22px 22px 22px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 6px; color: #4A3540; box-shadow: 0 3px 0 {{m.shadow}}; min-height: 150px; box-sizing: border-box; transform: rotate({{m.tilt}})">
          <span style="font-size: 15px; font-weight: 900; line-height: 1.4">{{m.title}}</span>
          <span style="font-size: 12px; line-height: 1.6; color: #5E4A54; flex: 1">{{m.body}}</span>
          <span style="display: flex; gap: 4px; flex-wrap: wrap">
            <sc-for list="{{m.tags}}" as="t" hint-placeholder-count="1"><span style="font-size: 11px; font-weight: 700; background: rgba(255,255,255,0.75); border-radius: 999px; padding: 1px 8px; color: #5E4A54">#{{t}}</span></sc-for>
          </span>
          <span style="font-size: 11px; color: #6E5A64">{{m.updated}}</span>
        </a>
      </sc-for>
    </div>
  </main>

  <nav aria-label="メイン" style="position: relative; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -3px 0 #F0E3B5; padding: 10px 10px 22px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; border-radius: 18px; color: #7D6470; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>今日</a>
    <a href="Tasks.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; border-radius: 18px; color: #7D6470; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><path d="M8 12l3 3 5-6"></path></svg>ToDo</a>
    <a href="Schedule.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; border-radius: 18px; color: #7D6470; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="4"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>予定</a>
    <a href="Memo.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; border-radius: 18px; background: #FFF0B8; color: #6E5200; font-size: 11px; font-weight: 900"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path><path d="M8 12h8M8 16h5"></path></svg>メモ</a>
    <a href="News.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; border-radius: 18px; color: #7D6470; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="4"></rect><path d="M7 9h10M7 13h10M7 17h6"></path></svg>ニュース</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B4501C","options":["#C2366B","#6B45C2","#1F7A5C","#B4501C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tag: '' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#B4501C';
    const colors = [
      { bg: '#FFE1EA', shadow: '#F3C5D3' },
      { bg: '#E6E0FA', shadow: '#D3C9F2' },
      { bg: '#DDF3EA', shadow: '#BFE3D4' },
      { bg: '#FFEFC2', shadow: '#F0DB97' }
    ];
    const all = [
      { title: 'フーリエ変換のメモ', body: '畳み込み定理：時間領域の畳み込みは周波数領域の積。', tags: ['数学', '信号処理'], updated: '11/16 08:12' },
      { title: '勉強会で聞くこと', body: '量子誤り訂正の閾値定理の前提条件を確認する。', tags: ['物理', '量子'], updated: '11/15 22:40' },
      { title: 'SQLite の CHECK', body: 'NULL を返す式との比較は = ではなく IS を使う。', tags: ['IT'], updated: '11/15 18:03' },
      { title: '読みたい本', body: '情報理論の入門書と、統計力学の教科書。', tags: ['本'], updated: '11/14 12:20' },
      { title: '固有値のイメージ', body: '線形写像で向きが変わらないベクトルと、その伸び率。', tags: ['数学'], updated: '11/13 21:15' },
      { title: 'エントロピー', body: '熱力学と情報理論のエントロピーの関係を整理する。', tags: ['物理', '数学'], updated: '11/12 09:48' }
    ];
    const sel = this.state.tag;
    const names = ['すべて', '数学', '物理', 'IT', '量子', '本'];
    const tags = names.map((n) => {
      const key = n === 'すべて' ? '' : n;
      const on = key === sel;
      return {
        label: n === 'すべて' ? n : '#' + n,
        pressed: on ? 'true' : 'false',
        bg: on ? '#4A3540' : '#FFFFFF',
        fg: on ? '#FFFFFF' : '#5E4A54',
        border: on ? '#4A3540' : '#EADDB0',
        pick: () => this.setState({ tag: key })
      };
    });
    const tilts = ['-1deg', '0.8deg', '0.5deg', '-0.7deg'];
    const memos = all
      .filter((m) => !sel || m.tags.indexOf(sel) >= 0)
      .map((m, i) => ({ ...m, ...colors[i % 4], tilt: tilts[i % 4] }));
    return { accent, tags, memos, count: memos.length };
  }
}
</script>
</body>
</html>
